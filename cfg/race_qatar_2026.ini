; Spanish GP 2026 simulation — Circuit de Barcelona-Catalunya
; Track: fn_barcelona / layout_gp_2025_fnr (modern 2025 F1 layout — verified
;   2026-06-08: fast_lane.ai + pit_lane.ai present, 24 pitboxes, 4657 m, Spain).
; CAR: rss_formula_hybrid_2025_alpine (Alpine 2025 mod — verified-rendering on
;   this system, same car used for the Monaco/Canada 2026 events).
;
; Player = Kimi Antonelli #12 (Mercedes-AMG W16) on POLE (CAR_0) — Antonelli was
;   the pole-sitter at the 2026 Spanish GP. (AC requires the player at CAR_0;
;   non-pole start would need a qualifying session.)
;
; SCENARIO: convert pole into a win at Barcelona. Unlike Monaco there is real
;   overtaking here (the long DRS straight into Turn 1), so the lead must be
;   defended through tyre deg over the distance.
;
; AI strength + roster identical to race_monaco_2026.ini, with the player taking
;   Antonelli's seat — the remaining 18 cars are the rest of the real 2026 grid.
; LIVERY CAVEATS (only 2025-spec AC mods exist for this car):
;   - Hadjar's car wears the 2025 Racing Bulls livery (no 2026 RB Hadjar skin).
;   - Audi entries wear 2025 Stake/Sauber livery (no 2026 Audi rebrand skin).
; MISSING from real 2026 grid (no AC skins for this car): Lindblad, Perez, Bottas.
;
; Built 2026-06-08 for SimRacingPitStop project — Spanish GP weekend 2026.

